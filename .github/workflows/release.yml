name: GitHub Release

# Creates a GitHub release for every pushed `v*` tag, with the tag's annotation
# as the release notes. Run it manually to release an already pushed tag.
# (`create-release.yml` is unrelated: it adds Lean toolchain tags.)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-from-tag
