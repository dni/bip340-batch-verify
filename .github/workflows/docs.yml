name: API Docs

# Builds the API docs and deploys them to GitHub Pages for every release
# (`v*` tag). It runs on the tag push rather than on the `release` event, since
# `release.yml` creates releases with `GITHUB_TOKEN`, whose events do not start
# other workflows. To rebuild, re-run this workflow's run for the tag: the
# docgen action only builds API docs on `push` events.
#
# The API docs cover the whole import closure (Mathlib, VCVio, ...), which takes
# about two hours without the docgen action's cache. A run can only restore
# caches saved on its own ref or on the default branch, so a cache saved by one
# tag's run is invisible to the next tag. The workflow therefore also runs on
# `main` whenever the dependencies change: that run only saves the cache, under
# `main`, where every later tag finds it.
#
# The docgen action would publish the API docs under `docs/` of the site, with
# nothing at the root. We deploy ourselves and publish the doc-gen4 output as
# the site, so its own `index.html` is the root page.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/docs.yml'

permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      # Installs elan and builds the project; the docgen action relies on both.
      - uses: leanprover/lean-action@v1
      # The API docs cover the whole import closure (Mathlib, VCVio, ...), and
      # the runner's default 4 GB of swap is not enough for doc-gen4. Lake also
      # grows large enough that spawning `git` (for `srcUri.github`) fails with
      # ENOMEM under the default overcommit heuristic, so allow overcommit.
      - name: Add swap for the docs build
        run: |
          sudo sysctl -w vm.overcommit_memory=1
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      # Pinned to a commit of `main`: the `v1` branch predates the
      # `build-page` and `deploy` inputs and ignores them.
      - uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c
        with:
          build-page: false
          deploy: false
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/docs/
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/deploy-pages@v4
